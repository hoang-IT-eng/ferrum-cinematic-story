<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FERRUM — Truyện Tranh Tương Tác 3D Hành Trình Thoát Gầy</title>
  <meta name="description" content="Trải nghiệm truyện tranh 3D thời gian thực phong cách khắc mực kể hành trình cậu bé gầy guộc bị chê bai, bế tắc phòng gym và bước ngoặt tăng cơ khoa học cùng FERRUM." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: #0c0d0f; color: #f4f0e8; font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif; line-height: 1.6; }
    #lcp-hero { position: fixed; inset: 0; z-index: 0; background: linear-gradient(to bottom, rgba(12, 13, 15, 0.56), rgba(12, 13, 15, 0.72)), url('/diorama/act-1/main.webp') center / cover no-repeat, #0c0d0f; pointer-events: none; transition: opacity 0.55s ease; }
    .prelude-curtain { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; padding: clamp(68px, 9vh, 108px) clamp(18px, 4vw, 64px) clamp(28px, 5vh, 52px); }
    .prelude-inner { width: min(1040px, 100%); height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
    .prelude-title { font-family: 'Cormorant Garamond Variable', Georgia, serif; font-weight: 600; font-size: clamp(2.3rem, 6.2vw, 5.1rem); line-height: 0.98; letter-spacing: -0.025em; margin: 0; text-wrap: balance; color: #f4f0e8; }
    .prelude-subtitle-echo { font-family: 'Cormorant Garamond Variable', Georgia, serif; font-style: italic; font-weight: 500; font-size: clamp(1.9rem, 4.6vw, 3.6rem); line-height: 1.05; color: #eaa35b; margin: 0 0 12px; }
    .prelude-lead { max-width: 54ch; margin: 0 auto 14px; font-size: clamp(0.95rem, 1.25vw, 1.08rem); color: rgba(244, 240, 232, 0.84); }
    .prelude-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
    .btn-primary { display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; background: #d98a3c; color: #0c0d0f; border: 1px solid #d98a3c; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .btn-ghost { display: inline-flex; align-items: center; gap: 8px; padding: 14px 22px; background: transparent; color: #f4f0e8; border: 1px solid rgba(244, 240, 232, 0.28); font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="lcp-hero" aria-hidden="true"></div>
  <div id="root">
    <section id="hero" class="prelude-curtain" aria-labelledby="hero-title">
      <div class="prelude-inner">
        <h1 id="hero-title" class="prelude-title">GẦY NHƯ QUE CỦI.</h1>
        <div class="prelude-center">
          <div class="prelude-actions">
            <button type="button" class="btn-primary">Bước vào · Bật âm thanh</button>
            <button type="button" class="btn-ghost">Xem im lặng</button>
          </div>
        </div>
        <div class="prelude-foot">
          <p class="prelude-subtitle-echo">Họ cười. Họ chỉ trỏ.</p>
          <p class="prelude-lead">Và cậu chỉ biết cúi đầu bước đi. Cho đến ngày cậu ngừng tập theo cảm tính để bước vào một kỷ luật có thể đo lường từng gram và từng kilogram.</p>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
